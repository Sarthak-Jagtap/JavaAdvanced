<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Product Detail</title>
</head>

<body>

	<h2>Product Details</h2>

	<form th:action="@{/admin/products}" method="post">

		<!-- Hidden ID (important for update) -->
		<input type="hidden" name="id" th:value="${product.id}" />

		<label>Name:</label><br>
		<input type="text" name="name" th:value="${product.name}" /><br><br>

		<label>Description:</label><br>
		<input type="text" name="description" th:value="${product.description}" /><br><br>

		<label>Price:</label><br>
		<input type="number" step="0.01" name="price" th:value="${product.price}" /><br><br>

		<label>Quantity:</label><br>
		<input type="number" name="quantity" th:value="${product.quantity}" /><br><br>

		<label>Image URL:</label><br>
		<input type="text" name="imageUrl" th:value="${product.imageUrl}" /><br><br>

		<!-- Category Dropdown -->
		<label>Category:</label><br>
		<select name="category.id">
			<option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
				th:selected="${cat.id == product.category.id}">
			</option>
		</select><br><br>

		<button type="submit">Update Product</button>

	</form>

	<br>

	<!-- Delete Button -->
	<a th:href="@{'/admin/products/delete/' + ${product.id}}">
		<button>Delete Product</button>
	</a>

	<br><br>

	<!-- Back Button -->
	<a href="/admin/products">
		<button>Back</button>
	</a>

</body>

</html>
