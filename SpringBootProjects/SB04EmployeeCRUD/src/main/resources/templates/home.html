<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee List</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
        }

        h2 {
            text-align: center;
        }

        .add-btn {
            display: block;
            width: 150px;
            margin: 10px auto;
            padding: 10px;
            text-align: center;
            background-color: green;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
            background-color: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #007BFF;
            color: white;
        }

        .edit-btn {
            padding: 5px 10px;
            background-color: orange;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete-btn {
            padding: 5px 10px;
            background-color: red;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<h2>Employee Management</h2>

<!-- ✅ Add Employee Button -->
<a th:href="@{/add}" class="add-btn">+ Add Employee</a>

<!-- Table -->
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Salary</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}"></td>
            <td th:text="${emp.name}"></td>
            <td th:text="${emp.email}"></td>
            <td th:text="${emp.salary}"></td>

            <!-- ✅ Edit Button -->
            <td>
                <a th:href="@{/edit/{id}(id=${emp.id})}" class="edit-btn">Edit</a>
            </td>

            <!-- ✅ Delete Button -->
            <td>
                <a th:href="@{/delete/{id}(id=${emp.id})}" 
                   class="delete-btn"
                   onclick="return confirm('Are you sure you want to delete?')">
                   Delete
                </a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
