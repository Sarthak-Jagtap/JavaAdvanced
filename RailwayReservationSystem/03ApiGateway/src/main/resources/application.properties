
server.port=8080

spring.application.name=api-gateway

# ===============================
# GATEWAY ROUTES
# ===============================

spring.cloud.gateway.routes[0].id=train-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/trains/**

spring.cloud.gateway.routes[1].id=search-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/search/**

spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/booking/**


# USER SERVICE ROUTE
spring.cloud.gateway.routes[3].id=user-service
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/**
# ===============================
# EUREKA (OPTIONAL)
# ===============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/